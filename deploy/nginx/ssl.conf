upstream backend_server {
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 https://nanesi.com.ua$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nanesi.com.ua;
    ssl_certificate /etc/letsencrypt/live/nanesi.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanesi.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nanesi.com.ua$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nanesi.com.ua;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/nanesi.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanesi.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://backend_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
