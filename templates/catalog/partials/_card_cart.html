{% load shop_extras i18n %}
{% if variants|length == 1 %}
  {% with variant=variants.0 %}
    <form method="post" action="{% url 'commerce:cart_add' variant.pk %}" data-cart-form data-cart-product="{{ product.pk }}" data-cart-variant="{{ variant.pk }}">
      {% csrf_token %}
      <button class="btn--icon{% if product.pk in cart_product_ids %} is-in-cart{% endif %}" type="submit"
              {% if not variant.in_stock %}disabled{% endif %}
              data-cart-product="{{ product.pk }}"
              data-label-in="{% trans 'В кошику' %}"
              data-label-out="{% trans 'До кошика' %}"
              aria-label="{% if product.pk in cart_product_ids %}{% trans 'В кошику' %}{% else %}{% trans 'До кошика' %}{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      </button>
    </form>
  {% endwith %}
{% else %}
  <div class="product-card__cart" data-cart-pick-root data-cart-product="{{ product.pk }}">
    <button class="btn--icon{% if product.pk in cart_product_ids %} is-in-cart{% endif %}" type="button"
            data-cart-pick-toggle
            data-cart-product="{{ product.pk }}"
            data-label-in="{% trans 'В кошику' %}"
            data-label-out="{% trans 'До кошика' %}"
            aria-expanded="false" aria-haspopup="true"
            aria-label="{% if product.pk in cart_product_ids %}{% trans 'В кошику' %}{% else %}{% trans 'До кошика' %}{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
    </button>
    <div class="product-card__pick" hidden data-cart-pick>
      <p class="product-card__pick-title">{% trans "Оберіть варіант" %}</p>
      <ul class="product-card__pick-list">
        {% for variant in variants %}
          <li>
            <form method="post" action="{% url 'commerce:cart_add' variant.pk %}" data-cart-form data-cart-product="{{ product.pk }}" data-cart-variant="{{ variant.pk }}">
              {% csrf_token %}
              <button class="product-card__pick-option{% if variant.pk in cart_variant_ids %} is-in-cart{% endif %}" type="submit"
                      data-cart-variant="{{ variant.pk }}"
                      {% if not variant.in_stock %}disabled{% endif %}>
                {% include "catalog/partials/_shade_swatch.html" with variant=variant %}
                <span class="product-card__pick-name">{{ variant.option_label }}</span>
                {% if variant.in_stock %}
                  <span class="product-card__pick-price">{{ variant.current_price|uah }}</span>
                {% else %}
                  <span class="product-card__pick-oos">{% trans "Немає" %}</span>
                {% endif %}
              </button>
            </form>
          </li>
        {% endfor %}
      </ul>
      <p class="product-card__pick-error" hidden data-cart-error></p>
    </div>
  </div>
{% endif %}
