{% load i18n %}
<div class="cart-drawer" data-cart-drawer hidden>
  <div class="cart-drawer__backdrop" data-cart-drawer-close tabindex="-1"></div>
  <aside
    class="cart-drawer__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-drawer-title"
    data-cart-drawer-panel
  >
    <div class="cart-drawer__head">
      <h2 id="cart-drawer-title" class="cart-drawer__title">{% trans "Кошик" %}</h2>
      <button type="button" class="cart-drawer__close" data-cart-drawer-close aria-label="{% trans 'Закрити' %}">✕</button>
    </div>
    <div
      class="cart-drawer__body"
      id="cart-drawer-body"
      data-cart-drawer-body
      hx-get="{% url 'commerce:cart_summary' %}"
      hx-trigger="cart-drawer-refresh from:body"
      hx-swap="innerHTML"
    >
      <p class="cart-drawer__loading">{% trans "Завантаження…" %}</p>
    </div>
  </aside>
</div>
